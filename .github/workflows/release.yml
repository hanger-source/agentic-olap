name: 发布 Agentic OLAP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已审核 draft release 的 tag，例如 v0.6.0
        required: true
        type: string
      submitted:
        description: 从 CI 日志确认已被 npm 受理的本次包名，空格分隔；这些包不重复提交
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  publish:
    if: github.repository == 'hanger-source/agentic-olap-skill'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      # GitHub 草稿发行物只向拥有仓库写权限的主体开放。
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.17.0 --registry=https://registry.npmjs.org
      - name: 下载已审核的同 tag 资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets" --pattern '*.tgz' --pattern SHA256SUMS
      - name: 使用 OIDC 并行发布 npm 包
        env:
          SUBMITTED_PACKAGES: ${{ github.event.inputs.submitted || '' }}
        run: node scripts/publish.mjs --tag "$RELEASE_TAG" --artifacts "$RUNNER_TEMP/release-assets" --submitted "$SUBMITTED_PACKAGES"

      - name: 公开 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
