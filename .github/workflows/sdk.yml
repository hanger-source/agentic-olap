name: 构建 JitPack SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送到源码仓库的精确发行标签，例如 v0.11.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jitpack-sdk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 请求 JitPack 构建，并确认 SDK 可匿名下载
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const { version } = JSON.parse(await readFile('project/cli/package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (tag !== `v${version}`) throw new Error('发行标签必须与源码产品版本一致');
          const base = `https://jitpack.io/com/github/hanger-source/agentic-olap`;
          const artifact = (module, extension) => `${base}/${module}/${tag}/${module}-${tag}.${extension}`;
          const response = await fetch(artifact('connector-api', 'pom'), {
            signal: AbortSignal.timeout(30 * 60 * 1000),
          });
          if (!response.ok) throw new Error(`JitPack 构建未完成：HTTP ${response.status}；查看 https://jitpack.io/#hanger-source/agentic-olap/${tag}`);
          await response.text();
          for (const module of ['connector-api', 'connector-loader']) {
            for (const extension of ['pom', 'jar']) {
              const result = await fetch(artifact(module, extension), { method: 'HEAD', signal: AbortSignal.timeout(60000) });
              if (!result.ok) throw new Error(`SDK 不可读取：${module}.${extension} HTTP ${result.status}；查看该标签的 JitPack 构建日志`);
            }
          }
          console.log(`JitPack SDK ${tag} 已构建，公开入口可匿名下载`);
          JS
