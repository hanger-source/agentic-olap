name: npm 平台运行包

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binary.yml'
      - 'examples/**'
      - 'project/**'
      - 'skills/**'
      - 'tools/**'
      - 'LICENSE'
      - 'docs/source-access.md'

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: project/service/go.mod
          cache-dependency-path: |
            project/service/go.sum
            tools/go.sum
      - run: go -C tools run ./cmd/olap-dev bootstrap
      - run: go -C tools run ./cmd/olap-dev build
      - run: go -C tools run ./cmd/olap-dev server-distribution --artifacts .tmp/release-distribution
      - run: go -C tools run ./cmd/olap-dev binary --distribution .tmp/release-distribution --artifacts .tmp/release-binary
      - name: 从实际 npm 包安装并使用完整服务
        run: node project/cli/tests/installed.mjs .tmp/release-binary/tarballs .tmp/installed-product
      - uses: actions/upload-artifact@v4
        with:
          name: npm-darwin-arm64
          path: |
            .tmp/release-binary/tarballs/*.tgz
            .tmp/release-binary/tarballs/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-darwin-arm64
          path: |
            .tmp/installed-product/report.json
            .tmp/installed-product/*.log
            .tmp/installed-product/persistent home/data/logs/*.log
          if-no-files-found: ignore
