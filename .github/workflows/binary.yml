name: 构建 npm 产品包

on:
  workflow_dispatch:
    inputs:
      tag:
        description: JVM 构件已在 JitPack 发布的精确标签
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: ./project/gradlew -p project --no-daemon --console=plain npmPackage
      - name: 从实际 npm 包安装并使用完整服务
        run: ./project/gradlew -p project --no-daemon --console=plain :development:installedProduct
      - uses: actions/upload-artifact@v4
        with:
          name: npm-product-darwin-arm64
          path: |
            project/build/npm/tarballs/*.tgz
            project/build/npm/tarballs/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-darwin-arm64
          path: |
            .tmp/installed-product/report.json
            .tmp/installed-product/*.log
            .tmp/installed-product/persistent home/data/logs/*.log
          if-no-files-found: ignore
