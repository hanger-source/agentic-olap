name: 工程质量

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      example:
        description: 全部检查，或仅运行指定的正式业务用法
        type: choice
        default: all
        options: [all, orders, procurement, subscriptions]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - run: ./project/gradlew -p project --no-daemon --console=plain assembleJvm
      - if: github.event_name != 'workflow_dispatch' || inputs.example == 'all'
        run: ./project/gradlew -p project --no-daemon --console=plain :integration-tests:test
      - if: github.event_name == 'workflow_dispatch' && (inputs.example == 'all' || inputs.example == 'orders')
        run: ./project/gradlew -p project --no-daemon --console=plain :development:orders
      - if: github.event_name == 'workflow_dispatch' && (inputs.example == 'all' || inputs.example == 'procurement')
        run: ./project/gradlew -p project --no-daemon --console=plain :development:procurement
      - if: github.event_name == 'workflow_dispatch' && (inputs.example == 'all' || inputs.example == 'subscriptions')
        run: ./project/gradlew -p project --no-daemon --console=plain :development:subscriptions
