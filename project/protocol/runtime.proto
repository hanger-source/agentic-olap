syntax = "proto3";

import "google/protobuf/any.proto";
import "query.proto";
import "governance.proto";

package agentic.olap.runtime.v6;

option java_package = "com.olap.prototype.protocol";
option java_multiple_files = true;

// Both directions use bounded, varint-length-delimited Frame messages on stdio.
// Business DSLs and exact artifact bytes have one existing semantic codec owner.
message Frame {
  oneof body {
    Bootstrap bootstrap = 1;
    Request request = 2;
    Response response = 3;
    Cancel cancel = 6;
    Shutdown shutdown = 7;
    ScriptRequest script_request = 8;
    ScriptResponse script_response = 9;
    CapabilityRequest capability_request = 10;
    CapabilityResponse capability_response = 11;
    ScriptWorkerFault script_worker_fault = 13;
    ScriptOutput script_output = 14;
    ProtocolFile file = 15;
    ScriptEmission script_emission = 16;
    SourceReadCompleted source_read_completed = 17;
  }
}

message SourceReadCompleted {
  string request_id = 1;
  agentic.olap.query.v1.SourceReadEvidence evidence = 2;
}

enum WorkerKind {
  WORKER_KIND_UNSPECIFIED = 0;
  QUERY = 1;
  ENGINE = 2;
  INSPECTION = 3;
  SOURCE_INSPECTION = 4;
  CANDIDATE_VALUES = 5;
}

message Bootstrap {
  string protocol = 1; // agentic-olap-runtime/v13，版本必须精确一致。
  bytes limits_json = 3;
  repeated string connector_manifests = 4;
  WorkerKind worker_kind = 5;
  bytes source_configurations_json = 6; // exact selected bindings only.
  ScriptConfiguration scripting = 7;
  string transfer_directory = 8;
}

// 同一官方完整 Frame 的私有文件交接；阈值只限制管道帧，不限制返回总量。
message ProtocolFile {
  string name = 1;
  uint64 bytes = 2;
  string sha256 = 3;
}

message Request {
  string request_id = 1;
  uint64 remaining_millis = 2;
  string operation = 4;
  google.protobuf.Any worker_model = 8;
}

message Response {
  string request_id = 1;
  bool success = 2;
  bytes error_json = 4;
  google.protobuf.Any model = 7;
  agentic.olap.query.v1.WorkerFailureFacts worker_failure = 8;
  map<string, int64> timing_nanos = 9;
}

message Cancel {
  string request_id = 1;
}

message Shutdown {}

message CapabilityInvocation {
  string operation_id = 1;
  // 仅接受该操作正式声明的具体消息，不接受 Struct 或任意类型名。
  google.protobuf.Any input = 2;
}

message ScriptConfiguration {
  string dsl_api_version = 1;
  repeated string compilation_classpath = 2;
  uint64 maximum_source_bytes = 3;
  uint64 maximum_frame_bytes = 5;
  uint32 maximum_input_depth = 6;
  uint64 maximum_input_nodes = 7;
  uint64 maximum_request_bytes = 8;
}

message ScriptSource {
  string source = 1;
  string source_name = 2;
  string dsl_api_version = 3;
}

message ScriptRequest {
  string request_id = 1;
  uint64 remaining_millis = 2;
  ScriptSource source = 3;
  bytes parameters_json = 4;
  string caller_subject = 5;
  string execution_directory = 6;
  string session_id = 7;
}

// 输出动作发生时已编码的不可变快照；与打印及完成事实共用同一有序通道。
message ScriptEmission {
  string request_id = 1;
  google.protobuf.Any output = 2;
}

// 普通脚本输出与完成回执在同一有序通道中交付；原生 JVM stderr 另受进程级限额。
message ScriptOutput {
  enum Stream {
    STREAM_UNSPECIFIED = 0;
    STDOUT = 1;
    STDERR = 2;
  }
  string request_id = 1;
  Stream stream = 2;
  bytes content = 3;
}

message SourceLocation {
  string source_name = 1;
  uint32 start_line = 2;
  uint32 start_column = 3;
  uint32 end_line = 4;
  uint32 end_column = 5;
  string snippet_id = 6;
}

message ScriptDiagnostic {
  string code = 1;
  string stage = 2;
  string severity = 3;
  string message = 4;
  SourceLocation location = 5;
  CapabilityFailure capability_failure = 6;
  repeated string field_path = 7;
  string expected = 8;
  string actual = 9;
  string resource = 10;
  uint64 limit = 11;
  uint64 observed = 12;
}

message ScriptResponse {
  string request_id = 1;
  bool success = 2;
  repeated ScriptDiagnostic diagnostics = 4;
  map<string, uint64> timing_nanos = 5;
  bool session_usable = 6;
  repeated ScriptResourceIssue resource_issues = 7;
  string state = 8;
}
// 私有服务诊断，不进入公开脚本报告。这里只复制有界值，不持有线程或类加载器。
message ScriptResourceIssue {
  string code = 1;
  string message = 2;
  uint32 observed_count = 3;
  repeated ScriptThreadObservation threads = 4;
  bool truncated = 5;
}
message ScriptThreadObservation {
  uint64 id = 1;
  string name = 2;
  string state = 3;
  bool daemon = 4;
  string context_class_loader = 5;
  repeated string stack = 6;
}
message ScriptWorkerFault { string request_id = 1; string code = 2; }

// 仅脚本求值角色可发起；可信主体、权限与期限由主服务持有，不接受脚本填写。
message CapabilityRequest {
  string request_id = 1;
  string call_id = 2;
  CapabilityInvocation invocation = 3;
}

message CapabilityFailure {
  string stage = 1;
  string code = 2;
  string message = 3;
  bytes details_json = 4;
  string operation_id = 5;
  string call_id = 6;
  repeated string field_path = 7;
  string diagnostic_id = 8;
}

message CapabilityResponse {
  string request_id = 1;
  string call_id = 2;
  string operation_request_id = 3;
  bool success = 4;
  google.protobuf.Any result = 5;
  CapabilityFailure failure = 6;
  repeated CapabilityEffect effects = 7;
}

// 仅由成功写入的 owner 从实际结果投影；引用不授予额外读取权限。
message CapabilityEffect {
  string read_operation = 1;
  oneof reference {
    agentic.olap.governance.v1.DefinitionImpactReference asset_version = 2;
    CapabilityOwnedMember owned_member = 3;
    agentic.olap.governance.v1.GovernanceReadRequestsReleaseIdentityRequest release = 4;
    string source_discovery = 5;
    agentic.olap.query.v1.QueryReference query = 6;
  }
  optional string status = 7;
  CapabilitySourceAdoptions source_adoptions = 8;
}
message CapabilitySourceAdoptions {
  repeated agentic.olap.governance.v1.SourceAdoptionRef references = 1;
  repeated string discovery_snapshot_ids = 2;
}
message CapabilityOwnedMember {
  agentic.olap.governance.v1.DefinitionImpactReference owner = 1;
  string kind = 2;
  string id = 3;
}
